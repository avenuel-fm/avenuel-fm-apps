<!doctype html>
<!-- 시안 전용 (앱 코드 아님). ?v=phone | pc | form | label. 값 = 2026년 전열기 관리대장.xlsx 1F 시트 -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전열필증 시안</title>
<style>
:root{--ink:#18202B;--sub:#3F4855;--muted:#5B6573;--faint:#7A8494;--line:#CBD2DB;--line2:#DCE1E7;--line3:#EDF0F3;--ground:#F4F6F8;
--blue:#1F5FA8;--blue-d:#174A84;--blue-bg:#E8F0FA;--green:#1F7A4D;--green-bg:#EAF5EF;--orange:#B4410F;--orange-bg:#FDF0E8;--red:#C0261A;--red-bg:#FDECEA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.del{color:var(--red);border-color:#EDB5AF;background:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.topbar{background:#fff;border-bottom:1px solid var(--line2)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px}
.t1{font-size:12px;color:var(--muted)}.t2{font-size:18px;font-weight:700}
.whoami{margin-left:auto;font-size:13px;font-weight:700;color:var(--blue-d);background:var(--blue-bg);border-radius:999px;padding:6px 12px}
main{max-width:1280px;margin:0 auto;padding:14px 16px 120px}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:15px;background:#fff;font-family:inherit}
.search{position:relative}.search .inp{padding-left:38px}.search::before{content:'';position:absolute;left:13px;top:13px;width:12px;height:12px;border:2px solid var(--faint);border-radius:50%}
.search::after{content:'';position:absolute;left:25px;top:26px;width:6px;height:2px;background:var(--faint);transform:rotate(45deg)}
.floors{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.fchip{flex:none;min-width:58px;height:48px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.fchip b{font-size:15px}.fchip small{font-size:11px;color:var(--muted)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}.fchip.on small{color:#DCE8F6}
.sumline{display:flex;align-items:center;gap:8px;margin:10px 0 8px;font-size:13px;color:var(--muted)}
.sumline b{color:var(--ink);font-size:15px}
.sumline .btn{margin-left:auto}
.store{background:#fff;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;overflow:hidden}
.store-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;min-height:56px}
.store-h .nm{font-size:16px;font-weight:700;flex:1;min-width:0}
.cnt{font-size:12px;font-weight:700;color:var(--blue-d);background:var(--blue-bg);border-radius:999px;padding:3px 10px}
.chev{width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:0 4px 4px}
.store.open .chev{transform:rotate(-135deg);margin-top:6px}
.more{width:36px;height:36px;border:0;background:transparent;font-size:20px;color:var(--muted);border-radius:8px}
.items{border-top:1px solid var(--line3)}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line3)}
.it:first-child{border-top:0}
.cb{width:22px;height:22px;flex:none;border:2px solid var(--line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.cb.on{background:var(--blue);border-color:var(--blue)}.cb.on::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .main{flex:1;min-width:0}
.it .l1{display:flex;align-items:baseline;gap:8px}
.it .no{font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.it .dn{font-size:15px;font-weight:700}
.it .l2{font-size:12.5px;color:var(--muted);margin-top:2px}
.it .w{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .w small{font-size:11px;color:var(--muted);font-weight:500}
.edit{width:36px;height:36px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--muted);font-size:15px}
.addrow{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line3)}
.addrow .btn{color:var(--blue-d);border-style:dashed;border-color:#A9C3E3;background:var(--blue-bg);width:100%}
.printed{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:6px;padding:1px 6px}
.noprint{font-size:11px;font-weight:700;color:var(--orange);background:var(--orange-bg);border-radius:6px;padding:1px 6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line2);padding:10px 16px 12px;box-shadow:0 -2px 10px rgba(24,32,43,.06)}
.bar-in{max-width:1280px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .selinfo{font-size:14px;font-weight:700;color:var(--blue-d);margin-right:auto}
.bar .btn{min-height:50px;font-size:15px;font-weight:700}
/* PC */
.pc{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.side{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:12px}
.side .floors{flex-wrap:wrap;padding:10px 0 6px}
.side .fchip{min-width:52px;height:44px}
.slist{margin-top:6px;max-height:620px;overflow:auto}
.srow{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;font-size:14px}
.srow .nm{flex:1;font-weight:500}
.srow.on{background:var(--blue-bg);color:var(--blue-d);font-weight:700}.srow.on .nm{font-weight:700}
.srow .n{font-size:12px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h1{margin:0;font-size:20px}
.ph .sub{font-size:13px;color:var(--muted)}
.ph .sp{flex:1}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{background:var(--blue-bg);color:var(--blue-d);font-weight:700;padding:9px 8px;font-size:13px;text-align:left;white-space:nowrap}
.tbl th:first-child{border-radius:8px 0 0 8px}.tbl th:last-child{border-radius:0 8px 8px 0}
.tbl td{padding:8px;border-bottom:1px solid var(--line3);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:#F5F9FE}
.tbl .no{font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.tbl .acts{display:flex;gap:6px}
.tbl .acts .edit{width:34px;height:34px}
.tbl .acts .x{color:var(--red);border-color:#F1C7C2}
/* 입력 창 */
.dim{position:fixed;inset:0;background:rgba(24,32,43,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px 14px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:18px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.fld{margin-bottom:11px}.fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:500}
.fld .ro{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:var(--ground);border:1px solid var(--line2);font-weight:700;color:var(--sub);gap:8px}
.fld .ro small{font-weight:500;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit{position:relative}.unit::after{content:'W';position:absolute;right:12px;top:12px;color:var(--muted);font-weight:700}
.sheet .acts{display:flex;gap:8px;margin-top:6px}.sheet .acts .btn{min-height:50px;font-weight:700}
/* 필증 */
.lwrap{padding:24px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.lrow{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.lcap{font-size:14px;font-weight:700;color:var(--sub);margin-bottom:8px}
.lcap small{font-weight:500;color:var(--muted)}
.zoom{zoom:4;background:#fff;box-shadow:0 0 0 .25px #9AA3AE}
.mono .label{filter:grayscale(1) contrast(1.6)}
.label{width:50mm;height:50mm;padding:1.8mm;display:flex;flex-direction:column;color:#000;background:#fff;font-family:'Noto Sans KR','Malgun Gothic',sans-serif}
.lh{display:flex;align-items:center;gap:1.4mm;height:9.6mm;margin-bottom:1.2mm}
.logo{width:6mm;height:6mm;flex:none;display:block;object-fit:contain}
.lt{flex:1;min-width:0}
.lt b{display:block;font-size:10pt;line-height:1.05;letter-spacing:-.15mm;white-space:nowrap}
.lt span{display:block;font-size:4.8pt;font-weight:700;margin-top:.7mm;white-space:nowrap;letter-spacing:-.05mm}
.lg{flex:1;display:grid;grid-template-columns:12.6mm 1fr;border:.35mm solid #000;}
.lg>div{border-top:.25mm solid #000;display:flex;align-items:center;padding:0 1mm;min-width:0}
.lg>div:nth-child(-n+2){border-top:0}
.lg .k{border-right:.25mm solid #000;font-size:5.6pt;font-weight:700;justify-content:center;letter-spacing:-.1mm;white-space:nowrap}
.lg .v{font-size:7.6pt;font-weight:700;white-space:nowrap;overflow:hidden;letter-spacing:-.1mm}
.lg .v.big{font-size:9pt}
.lg .v.sig{font-family:'Gungsuh','Batang',serif;font-size:8pt;font-weight:400}
.lgq{flex:1;display:grid;grid-template-columns:12.6mm 1fr 15.2mm;grid-template-rows:repeat(6,1fr);border:.35mm solid #000}
.lgq>div{border-top:.25mm solid #000;display:flex;align-items:center;padding:0 1mm;min-width:0}
.lgq .k{border-right:.25mm solid #000;font-size:5.6pt;font-weight:700;justify-content:center;white-space:nowrap;letter-spacing:-.1mm}
.lgq .v{font-size:7.6pt;font-weight:700;white-space:nowrap;overflow:hidden;letter-spacing:-.1mm}
.lgq .v.big{font-size:9pt}
.lgq .v.sig{font-family:'Gungsuh','Batang',serif;font-size:8pt;font-weight:400}
.lgq .q{grid-column:3;grid-row:4/7;border-left:.25mm solid #000;padding:.6mm;justify-content:center}
.lgq .wide{grid-column:2/4}
.lgq .q img,.lgq .q canvas{width:13.6mm!important;height:13.6mm!important;image-rendering:pixelated}
.note{max-width:900px;font-size:13.5px;line-height:1.7;color:var(--sub);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:12px 16px}
.note b{color:var(--ink)}
</style>
