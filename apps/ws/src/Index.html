<html lang="ko">
<head>
<base target="_top">

<style>
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.top{background:#fff;border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20}
.top-in{max-width:1100px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px}
.ttl{display:flex;flex-direction:column;flex:1;min-width:0}
.ttl small{font-size:12px;color:var(--muted)}
.ttl b{font-size:18px}
.me{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue-d);font-size:13px;font-weight:700;white-space:nowrap}
.grid6{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.grid6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:104px;cursor:pointer;text-align:left}
.tile b{font-size:17px}
.tile small{font-size:12px;color:var(--muted)}
.tile.on{border:2px solid var(--blue);padding:13px}
.ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line2);border-radius:12px;cursor:pointer;width:100%;text-align:left}
.list{display:flex;flex-direction:column;gap:10px}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.b-info{background:var(--blue-bg);color:var(--blue-d)}
.b-warn{background:var(--orange-bg);color:var(--orange)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--line3);color:var(--sub)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#fff;border:1px solid var(--line2);border-radius:12px}
.tools .inp{flex:1 1 220px}
.store{background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.store-h{display:flex;align-items:baseline;gap:8px;padding:10px 14px}
.store-h b{flex:1;font-size:15px}
.fe{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px 6px 14px;border-top:1px solid var(--line3)}
.fe input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex:none}
.qrmini{width:44px;height:44px;flex:none;background:#fff;border:1px solid var(--line);border-radius:4px;padding:3px;cursor:pointer}
.qrmini img,.qrmini canvas{width:100%!important;height:100%!important}
.fname{flex:1;display:flex;flex-direction:column;min-width:0}
.fname b{font-size:14px}
.fname small{font-size:12px;color:var(--muted)}
.floorh{font-size:13px;font-weight:700;color:var(--muted);margin:6px 2px 0}
.mnav{display:flex;align-items:center;gap:8px}
.mnav .btn{width:44px;padding:0;font-size:20px}
.mnav div{flex:1;text-align:center;display:flex;flex-direction:column}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px;font-size:13px}
@media(min-width:700px){.legend{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px}
.tree{padding:4px 0 4px 14px}
.tree-root{display:flex;align-items:center;gap:8px;height:44px;font-weight:700;font-size:14px}
.floor{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px 6px 0;border-top:1px solid var(--line3);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;cursor:pointer;text-align:left}
.elbow{width:16px;height:28px;border-left:2px solid var(--line2);border-bottom:2px solid var(--line2);margin:-20px 0 0 6px;flex:none}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line3)}
.fl{min-height:36px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.fl.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.feb{width:100%;background:#fff;border:none;border-top:1px solid var(--line3);display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 14px;text-align:left;cursor:pointer}
.feb:disabled{cursor:default}
.ph43{aspect-ratio:4/3;background:var(--line3);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph43 img{max-width:100%;max-height:100%;object-fit:contain}
.sig{border:1px solid var(--line2);border-radius:8px;min-height:64px;display:flex;align-items:center;justify-content:center;padding:4px;background:#fff}
.sig img{max-width:100%;max-height:90px}
.key{min-height:60px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:24px;font-weight:500;cursor:pointer}
.pin-dot{width:18px;height:18px;border-radius:9px;border:2px solid #9AA4B2}
.pin-dot.on{background:var(--blue);border-color:var(--blue)}
.spad{position:relative;width:100%;height:clamp(190px,38vh,320px);border-radius:12px;border:2px dashed #B8C0CB;background:#fff;touch-action:none;overflow:hidden}
.spad.inked{border-style:solid;border-color:var(--line)}
.spad canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.sgrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line3)}
.sgrow:first-child{border-top:none}
.sgno{width:28px;height:28px;border-radius:14px;background:var(--line3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sgimg{width:120px;height:56px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line3);border-radius:6px;background:#fff}
.sgimg img{max-width:100%;max-height:42px}
.sgimg small{font-size:10px;color:var(--muted);line-height:1}
/* 명일 작업 예정 (WS_서류작업 9장) — 휴대폰은 줄마다 카드, 768px 이상은 표 */
.nwhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.nwhead b{flex:1 1 auto;font-size:17px}
.nwdate{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px 0 14px;border-radius:999px;background:var(--blue-bg);color:var(--blue-d);font-weight:700}
.nwdate input{border:0;background:transparent;color:inherit;font-weight:700;font-size:16px;min-height:44px;cursor:pointer}
.nwmeta{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.nwnote{margin-top:10px;font-size:13px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:8px 12px;line-height:1.5}
.nwrows{display:flex;flex-direction:column;gap:12px}
.nwrow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 44px;grid-template-areas:"no dept dept del" "work work work work" "place place note note";gap:8px 10px;align-items:end;background:#fff;border:1px solid var(--line2);border-left:5px solid var(--line2);border-radius:12px;padding:12px 14px}
.nwrow .nwno{grid-area:no;align-self:center}.nwrow .seg{grid-area:dept}.nwrow .nwdel{grid-area:del}
.nwrow .f-work{grid-area:work}.nwrow .f-place{grid-area:place}.nwrow .f-note{grid-area:note}
.nwrow label{display:flex;flex-direction:column;gap:4px;min-width:0}
.nwrow label span{font-size:13px;font-weight:500;color:var(--sub)}
.nwno{width:30px;height:30px;border-radius:15px;background:var(--blue-bg);color:var(--blue-d);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.nwdel{width:44px;padding:0;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:44px;background:#fff}
.seg button{flex:1;border:0;background:#fff;font-size:14px;color:var(--sub);padding:0 8px;cursor:pointer;min-width:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.nwrow.danger{border-left-color:var(--red);background:#FFFBFA}
.nwrow.danger .nwno{background:var(--red-bg);color:var(--red)}
.nwrow.danger .inp{color:var(--red);border-color:#EBC2BD}
.nwhd{display:none}
.nwadd{width:100%;border-style:dashed;color:var(--blue)}
.nwbar{position:sticky;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line2);margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.nwbar .btn{flex:1;min-height:52px;font-size:16px;font-weight:700}
.nwbar .btn.green{background:var(--green);border-color:var(--green);color:#fff}
.nwstate{font-size:12.5px;color:var(--green);white-space:nowrap}
.nwstate.dirty{color:var(--orange)}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:8px 2px -2px}
/* TBM (WS_서류작업 4~5장) */
.tbsum{display:flex;align-items:center;gap:8px;padding:12px 14px}
.tbw{padding:14px;display:flex;flex-direction:column;gap:12px}
.tbh{display:flex;align-items:flex-start;gap:10px}.tbh .fname b{font-size:15px;line-height:1.35}
.tbedit{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--ground)}
.tbf{display:flex;flex-direction:column;gap:5px;min-width:0}
.tbf>span{font-size:12.5px;font-weight:700;color:var(--sub)}.tbf em{font-style:normal;font-weight:500;color:var(--green);margin-left:4px}
.tbrisk{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}.tbrisk small{font-size:12px;color:var(--muted)}
.tbseg{min-height:40px}.tbseg button{width:40px;flex:none}
.tblv{margin-left:auto;padding:6px 12px;border-radius:8px;font-size:15px;background:var(--line3)}
.tblv.hi{background:var(--red-bg);color:var(--red)}.tblv.mid{background:var(--orange-bg);color:var(--orange)}.tblv.lo{background:var(--green-bg);color:var(--green)}
.tbfx{display:flex;flex-direction:column;gap:6px}
.tbfx label{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.tbfx label.on{border-color:var(--blue);background:var(--blue-bg)}
.tbfx input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--blue);flex:none}
.tbown{display:flex;gap:6px}.tbown .inp{flex:1}
.tbck{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.tbck button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.tbck button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.tbphs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.tbph{display:flex;flex-direction:column;gap:6px;min-width:0}.tbph>b{font-size:13px}
.tbpb{display:flex;gap:6px}.tbpb .btn{flex:1;padding:0 6px}
.nwimg{display:block;max-width:100%;border:1px solid var(--line2);border-radius:8px}
@media(min-width:768px){
  .nwrows{gap:0;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff}
  .nwrow,.nwhd{grid-template-columns:44px 200px 170px minmax(0,1fr) 150px 44px;grid-template-areas:"no dept place work note del";align-items:center;border:0;border-top:1px solid var(--line3);border-radius:0;padding:6px 8px}
  .nwhd{display:grid;gap:8px 10px;background:var(--blue-bg);color:var(--blue-d);font-size:13px;font-weight:700;text-align:center;padding:10px 8px;border-top:0}
  .nwrow.danger{background:#FFF6F5;box-shadow:inset 4px 0 0 var(--red)}
  .nwrow .nwno{justify-self:center}
  .nwrow label span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .nwrows .nwadd{border:0;border-top:1px solid var(--line3);border-radius:0}
  .nwbar{justify-content:flex-end;border-radius:12px 12px 0 0}
  .nwbar .btn{flex:none;min-width:170px;min-height:44px;font-size:15px}
}
/* 출근현황 (WS_출근현황, 결정 88) — 상태 딱지 색은 엑셀 색을 부드럽게 */
.attag{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:28px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent;background:#fff;flex:none}
button.attag{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.attag::after{content:'▾';font-size:10px;margin-left:3px;opacity:.7}
.s-on{background:var(--green-bg);color:var(--green)}.s-97{color:var(--sub);border-color:var(--line)}
.s-hu{background:#FFF4C7;color:#7A5A00}.s-yeon{background:#FDE4E1;color:#B3261E}.s-beop{background:#FCE4F1;color:#A3266B}
.s-ya{background:#E1ECFB;color:var(--blue-d)}.s-bi{background:#ECEEF1;color:#4A5361}.s-sick{background:#F3E8FD;color:#6B3FA0}
.s-ban{color:#B3261E;border-color:#EDB5AF}.s-gj{background:#DDF3F5;color:#0F6E78}.s-etc{color:var(--muted);border:1px dashed var(--line)}
.atwho{font-size:15px;font-weight:500;color:var(--blue-d);background:var(--blue-bg);border-radius:8px;padding:8px 12px;line-height:1.6}
.atorg{display:grid;gap:12px}
.atsec{background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.atsec h2{margin:0;font-size:15px;font-weight:700;padding:10px 14px;display:flex;align-items:center;border-bottom:1px solid var(--line3)}
.atsec h2 small{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.k0 h2{background:#EEF1F5}.k1 h2{background:#F1EDF8;color:#4B3A78}.k2 h2{background:var(--blue-bg);color:var(--blue-d)}.k3 h2{background:var(--green-bg);color:var(--green)}
.atppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;padding:10px}
.atp{display:flex;align-items:center;gap:8px;border:1px solid var(--line3);border-radius:10px;padding:8px;min-width:0;background:#fff}
.atav{width:34px;height:34px;border-radius:17px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#E3E7EC;color:var(--sub)}
.k1 .atav{background:#E7E1F3;color:#4B3A78}.k2 .atav{background:#D9E6F7;color:var(--blue-d)}.k3 .atav{background:#D5ECDF;color:var(--green)}
.atnm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.atnm small{font-size:11px;color:var(--muted);line-height:1.2}
.atnm b{font-size:15px;line-height:1.3;white-space:nowrap}
.atp.vac{border-style:dashed;color:var(--muted);justify-content:center;font-size:13px;min-height:52px}
.atfix{width:7px;height:7px;border-radius:4px;background:var(--orange);flex:none}
.atsums{display:grid;gap:12px}
.atduo{display:grid;gap:12px}
.atst{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff;font-size:14px}
.atst caption{text-align:left;font-weight:700;font-size:14px;padding:0 2px 6px}
.atst th{background:var(--blue-bg);color:var(--blue-d);font-weight:700;padding:8px 6px;font-size:13px}
.atst th.g2{background:#F1EDF8;color:#4B3A78}
.atst td{padding:8px 6px;border-top:1px solid var(--line3);text-align:center}
.atst td:first-child{text-align:left;padding-left:12px;color:var(--sub)}
.atst td+td,.atst th+th{border-left:1px solid var(--line3)}
.atst tr.sum td{font-weight:700;background:#F8FAFC}
.atst .z{color:var(--muted)}
.atopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.atopts .attag{height:44px;font-size:15px;width:100%;border-radius:10px}
.atopts .attag::after{content:none}
.atopts .attag.sel{outline:3px solid var(--blue);outline-offset:1px}
.atwk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.atwk button{height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer}
.atwk button.sel{background:#FFF4C7;border-color:#E2C14A;color:#7A5A00}
.atwk button:disabled{cursor:default;opacity:1}
.atcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.atcal .w{font-size:12px;text-align:center;color:var(--muted)}
.atcal button{min-height:56px;border:1px solid var(--line3);border-radius:10px;background:#fff;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.atcal button b{font-size:15px}.atcal button small{font-size:10.5px;color:var(--muted)}
.atcal .sun b{color:var(--red)}.atcal .sat b{color:var(--blue)}
.atcal button.on{background:var(--blue);border-color:var(--blue)}.atcal button.on b,.atcal button.on small{color:#fff}
.atcal button.today{border:2px solid var(--blue)}
.atchk{font-size:13px;line-height:1.7}.atchk .w{color:var(--orange);font-weight:700}
.atimg{width:1200px;background:#fff;padding:28px 32px 22px;font-family:'Noto Sans KR',sans-serif;color:var(--ink)}
.atimg .attl{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}.atimg .attl b{font-size:24px}.atimg .attl span{font-size:14px;color:var(--muted)}
.atimg .atorg,.atimg .atduo{grid-template-columns:1fr 1fr}
.atimg .atsums{grid-template-columns:1fr 2fr;margin-top:14px}
.atimg .stamp{margin-top:10px;color:var(--muted);font-size:12px;text-align:right}
@media(min-width:900px){.wrap .atorg{grid-template-columns:1fr 1fr}.wrap .atsums{grid-template-columns:1fr 2fr}.wrap .atduo{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.wrap .atppl{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap .atnm b{font-size:14px}.wrap .atp{gap:6px;padding:7px 6px}.wrap .atav{width:28px;height:28px;font-size:13px}.wrap .attag{min-width:0;padding:0 7px;font-size:12.5px}.wrap .atppl{gap:6px;padding:8px}}
/* 전열필증 (WS_전열필증 15.3.20, 결정 96) */
.ehfls{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.ehfl{flex:none;min-width:60px;min-height:48px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;cursor:pointer;padding:4px 8px}
.ehfl b{font-size:15px}.ehfl small{font-size:11px;color:var(--muted)}
.ehfl.on{background:var(--blue);border-color:var(--blue);color:#fff}.ehfl.on small{color:#DCE8F6}
.ehsum{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0;font-size:13px;color:var(--muted)}
.ehsum span{flex:1 1 auto}.ehsum b{color:var(--ink);font-size:15px}
.ehcnt{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue-d);font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.ehst{margin-bottom:8px}
.ehsh{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;min-height:56px}
.ehsh input,.ehit input,.ehtbl input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}
.ehsn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.ehsn b{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehchev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px}
.ehchev.up{transform:rotate(-135deg);margin:6px 6px 0}
.ehmore{width:40px;padding:0;font-size:18px;color:var(--muted);border-color:transparent;background:none}
.ehit{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-top:1px solid var(--line3)}
.ehit.sel{background:#F5F9FE}
.ehl1{display:flex;align-items:baseline;gap:8px;min-width:0}.ehl1 b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 로그인 확인. 늦게 끝난 확인(앞선 boot)은 무시하고, 이미 다른 화면이면 메인으로 보내지 않음 (결정 48) */

}

const TBM_CHECKS = ['사다리', '비계', '우마', '테이블리프트', '크레인', '스카이', '달비계', '용접기'];

function tbmText(w) { return (w.work || '') + ' ' + (w.note || ''); }
function tbmHas(t, k) { if (k === '비계') t = t.replace(/[달말]비계/g, ''); return TBM_CHECK_WORDS[k].some(x => t.indexOf(x) !== -1); }

/* 그림 파일(PNG) — 양식 v2 칸 순서 그대로, 색은 도면협의 디자인. 그림 칸 1000px를 2배(가로 2000px)로 그림 (결정 68) */
function nwDraw() {
  const n = S.nw, rows = nwFilled(), W = 1000, SC = 2, PAD = 32;
  const COLS = [['구 분', 160], ['순번', 52], ['부 서', 110], ['작업장소', 150], ['작업 내용', 0], ['비 고', 130]];
  COLS[4][1] = W - PAD * 2 - COLS.reduce((a, c) => a + c[1], 0);
  const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = (w, px) => { g.font = w + ' ' + px + 'px ' + FONT; };
  function wrap(t, maxW) {   // 칸 너비에 맞춰 글자 단위로 줄바꿈
    font(400, 15); const out = []; let line = '';
    for (const ch of String(t || '')) { if (g.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch; }
    out.push(line); return out;
  }
  const cells = rows.map((r, i) => [String(i + 1), r.dept, r.place, r.work, r.note].map((t, j) => wrap(t, COLS[j + 1][1] - 20)));
  const rowH = cells.map(c => Math.max(38, 14 + Math.max(...c.map(l => l.length)) * 22));
  const tableY = 118, headH = 40, bodyH = Math.max(rowH.reduce((a, b) => a + b, 0), 76), H = tableY + headH + bodyH + 72;
  cv.width = W * SC; cv.height = H * SC; g.scale(SC, SC);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.textBaseline = 'middle';
  font(700, 20); g.fillStyle = '#18202B'; g.fillText('■ 에비뉴엘 시설팀 명일 작업 일정 현황', PAD, 44);
  const [yy, mm, dd] = n.date.split('-');
  let x = PAD; font(700, 16);
  const put = (t, box) => {
    const w = g.measureText(t).width + (box ? 24 : 0);
    if (box) { g.fillStyle = '#E8F0FA'; rr(x, 70, w, 32, 8); g.fill(); g.fillStyle = '#174A84'; g.fillText(t, x + 12, 87); } else { g.fillStyle = '#18202B'; g.fillText(t, x, 87); }
    x += w + 8;
  };
  put('일자 :'); put(yy, 1); put('년'); put(String(Number(mm)), 1); put('월'); put(String(Number(dd)), 1); put('일');
  function rr(x0, y0, w, hh, r) { g.beginPath(); g.moveTo(x0 + r, y0); g.arcTo(x0 + w, y0, x0 + w, y0 + hh, r); g.arcTo(x0 + w, y0 + hh, x0, y0 + hh, r); g.arcTo(x0, y0 + hh, x0, y0, r); g.arcTo(x0, y0, x0 + w, y0, r); g.closePath(); }
  const TW = W - PAD * 2, TH = headH + bodyH;
  g.save(); rr(PAD, tableY, TW, TH, 12); g.clip();
  g.fillStyle = '#E8F0FA'; g.fillRect(PAD, tableY, TW, headH);
  g.fillStyle = '#F8FAFC'; g.fillRect(PAD, tableY + headH, COLS[0][1], bodyH);
  const colX = []; let cx = PAD; COLS.forEach(c => { colX.push(cx); cx += c[1]; });
  font(700, 15); g.fillStyle = '#174A84'; g.textAlign = 'center';
  COLS.forEach((c, j) => g.fillText(c[0], colX[j] + c[1] / 2, tableY + headH / 2));
  let y = tableY + headH;
  cells.forEach((c, i) => {
    const red = nwDanger(rows[i]);
    if (red) { g.fillStyle = '#FFF4F3'; g.fillRect(colX[1], y, TW - COLS[0][1], rowH[i]); }
    if (i) { g.fillStyle = '#EDF0F3'; g.fillRect(colX[1], y, TW - COLS[0][1], 1); }
    font(400, 15); g.fillStyle = red ? '#C0261A' : '#18202B';
    c.forEach((lines, j) => {
      const col = j + 1, left = col === 4;
      g.textAlign = left ? 'left' : 'center';
      const top = y + rowH[i] / 2 - (lines.length - 1) * 11;
      lines.forEach((l, k) => g.fillText(l, left ? colX[col] + 10 : colX[col] + COLS[col][1] / 2, top + k * 22));
    });
    y += rowH[i];
  });
  g.fillStyle = '#EDF0F3'; colX.slice(1).forEach(cx2 => g.fillRect(cx2, tableY + (cx2 === colX[1] ? 0 : 0), 1, TH));
  g.fillStyle = '#CBD2DB'; g.fillRect(PAD, tableY + headH - 1, TW, 1);
  font(500, 15); g.fillStyle = '#3F4855'; g.textAlign = 'center';
  g.fillText('㈜맥서브', PAD + COLS[0][1] / 2, tableY + headH + bodyH / 2 - 12); g.fillText('에비뉴엘 잠실점', PAD + COLS[0][1] / 2, tableY + headH + bodyH / 2 + 12);
  g.restore();
  g.strokeStyle = '#CBD2DB'; g.lineWidth = 1; rr(PAD + .5, tableY + .5, TW - 1, TH - 1, 12); g.stroke();
  g.textAlign = 'left'; font(400, 14); g.fillStyle = '#C0261A';
  g.fillText('※ 사다리, 위험물작업(용접·페인트) 작업은 빨간색으로 표시', PAD, tableY + TH + 28);
  return cv;
}

const AT_CODES = ['', '9-7', '휴', '연', '법', '야', '비', '병가', 'A반', 'P반', 'A검진', 'P검진'];

function atLbl(v) { return v === '' ? '출' : v; }
function atRole(r) { return r === '교대반장' ? '교대' : r; }   // 교대반장이라는 직급은 없음 (사용자 11-07)
function atIsDay(v) { return v === '' || v === '9-7' || /^[AP](반|검진)$|^[전후]반$/.test(v); }   // 서버 atIsDay_와 같음
function atGrp(v) { return atIsDay(v) ? '주' : v === '야' ? '야' : v === '비' ? '비번' : '휴무'; }
function atWd(d) { return WEEK[new Date(d + 'T12:00:00+09:00').getDay()]; }
function atKo(d) { return Number(d.slice(0, 4)) + '년 ' + Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일 (' + atWd(d) + ')'; }
function atTitle(sec) { return sec.indexOf('관') === 0 ? '관리파트' : /^[가-힣]{4}$/.test(sec) ? sec.slice(0, 2) + '·' + sec.slice(2) : sec; }
/* 엑셀 줄 → 조직도 구역: 소장 = 사업소장, 나머지는 엑셀 구역 순서대로 (5장) */
function atGroups(people) {
  const out = [{ t: '사업소장', p: [] }];
  people.forEach((x, i) => {
    if (x.role === '소장') return out[0].p.push(Object.assign({ i }, x));
    const t = atTitle(x.sec); let g = out.find(o => o.t === t);
    if (!g) { g = { t, p: [] }; out.push(g); }
    g.p.push(Object.assign({ i }, x));
  });
  out.forEach(g => g.p.sort((a, b) => !a.name - !b.name));   // 공석은 구역 맨 끝 (sort는 같은 값끼리 순서 유지)
  return out.filter(g => g.p.length);
}
function atOrg(people, ed) {

function atSums(people) {

  atGroups(people).forEach(g => { const t = g.t === '사업소장' || g.t === '관리파트' ? '관리' : g.t; let p = parts.find(x => x.n === t); if (!p) parts.push(p = { n: t, p: [] }); p.p = p.p.concat(g.p); });
  const K = ['a', 'b', 'v', '주', '야', '휴무', '비번'], T = { n: '합계' }; K.forEach(k => T[k] = 0);
  const rows = parts.map(x => { const q = x.p.filter(y => y.name), r = { n: x.n, a: x.p.length, b: q.length, v: x.p.length - q.length };
    ['주', '야', '휴무', '비번'].forEach(gk => r[gk] = q.filter(y => atGrp(y.v) === gk).length); K.forEach(k => T[k] += r[k]); return r; });

}

let XLS = null;

/** 표(줄×칸 글자) → { ym, rows, tot, unknown } — 날짜 줄(1, 2, 3…)을 찾아 그 왼쪽 2·3·4칸 = 이름·직책·구역 */
function atParse(aoa) {
  const c = v => String(v == null ? '' : v).trim();
  let ym = '', hr = -1, c0 = -1;
  aoa.slice(0, 6).forEach(row => (row || []).forEach(v => { const m = /(\d{4})\s*년\s*(\d{1,2})\s*월/.exec(c(v)); if (m && !ym) ym = m[1] + '-' + m[2].padStart(2, '0'); }));
  for (let r = 0; r < Math.min(aoa.length, 20) && hr < 0; r++) { const row = aoa[r] || []; for (let k = 0; k < row.length - 1; k++) if (c(row[k]) === '1' && c(row[k + 1]) === '2') { hr = r; c0 = k; break; } }
  if (hr < 0 || c0 < 2) return { error: '날짜 줄(1, 2, 3 …)을 찾지 못했습니다. 근무 스케줄 엑셀이 맞는지 확인해 주세요.' };
  let n = 0; while (n < 31 && c(aoa[hr][c0 + n]) === String(n + 1)) n++;
  const rows = [], unknown = {}; let sec = '', tot = null;
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r] || [], a = c0 >= 4 ? c(row[c0 - 4]) : '', role = c(row[c0 - 3]), name = c(row[c0 - 2]);
    const days = Array.from({ length: n }, (_, i) => c(row[c0 + i]));
    if (/총원/.test(a + role)) { tot = days.map(Number); continue; }
    if (/합계/.test(a + role)) continue;
    if (a) sec = a.replace(/\s+/g, '');
    if (!role) continue;   // 요일 줄·아래 안내 글은 직책 칸이 비어 있음

    rows.push({ sec, role, name, days });

  const ju = Array.from({ length: n }, (_, i) => rows.filter(x => x.name && atIsDay(x.days[i])).length);

function qrMatrix(token, text, level) {   // text·level: 전열필증은 ?eh= 주소, 작은 칸이라 오류 보정 L (칸 수가 적어 점이 굵음)

  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
  const u = per * scale;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (rows[r][c]) g.fillRect((c + quiet) * u, (r + quiet) * u, u, u);

function ehSelIds() { return Object.keys(S.ehSel || {}).filter(k => S.ehSel[k]); }
function ehDate(d) { return String(d || '').replace(/-/g, '.'); }
function ehW(w) { return w === '' || w == null ? '' : Number(w).toLocaleString('ko-KR'); }
function ehToday() { const k = new Date(Date.now() + 9 * 3600e3); return k.toISOString().slice(0, 10); }
async function openEh() { S.ehSel = {}; S.ehQ = ''; S.ehOpen = S.ehOpen || {}; go('eh'); await loadEh(S.ehFloor || '1F'); }
async function loadEh(floor) { S.ehBusy = true; render(); try { ehSet(await call('ehList', floor)); } finally { S.ehBusy = false; render(); } }
function ehSet(r) {
  if (!r || !r.ok) { if (r && r.error) toast(r.error); return; }
  if (S.eh && S.eh.floor !== r.floor) S.ehSel = {};
  S.eh = r; S.ehFloor = r.floor;
  if (!r.stores.some(s => s.id === S.ehCur)) S.ehCur = r.stores.length ? r.stores[0].id : '';
  render();
}
function ehStore(id) { return S.eh.stores.find(s => s.id === id); }
function ehItem(id) { for (const s of S.eh.stores) { const i = s.items.find(x => x.id === id); if (i) return Object.assign({ store: s }, i); } return null; }
function ehFloorGo(f) { if (S.eh && f === S.eh.floor) return; S.ehSel = {}; loadEh(f); }
function ehJump(f, id) { S.ehQ = ''; S.ehCur = id; S.ehOpen[id] = true; if (S.eh.floor !== f) { S.ehSel = {}; loadEh(f); } else render(); }
function ehTog(id) { S.ehOpen[id] = !S.ehOpen[id]; S.ehCur = id; render(); }
function ehPick(id, on) { S.ehSel[id] = on; render(); }
function ehPickStore(id) { const s = ehStore(id), all = s.items.length && s.items.every(i => S.ehSel[i.id]); s.items.forEach(i => { S.ehSel[i.id] = !all; }); render(); }

function ehSearch(el) { S.ehQ = el.value; const b = $('ehBody'); if (b) b.innerHTML = ehBody(); }

function renderEh() {
  ehWas = ehWide();
  return topbar('점검 ›', '전열필증') + '<div class="wrap">' +
    '<input id="ehQ" class="inp" type="search" placeholder="매장명 검색 (모든 층)" aria-label="매장명 검색" value="' + h(S.ehQ || '') + '" oninput="ehSearch(this)">' +
    '<div id="ehBody">' + ehBody() + '</div></div>';
}
function ehBody() {
  const r = S.eh, selN = ehSelIds().length;
  let body = '<div class="banner b-gray">불러오는 중…</div>';
  if (r) {
    const q = (S.ehQ || '').trim().toLowerCase().replace(/\s+/g, '');
    const hits = q ? r.names.filter(n => n[1].toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1) : null;
    const fl = r.floors.find(f => f.code === r.floor);
    body = '<div class="ehfls" role="tablist">' + r.floors.map(f => '<button class="ehfl' + (f.code === r.floor ? ' on' : '') + '" role="tab" aria-selected="' + (f.code === r.floor) + '" onclick="ehFloorGo(\'' + f.code + '\')"><b>' + f.code + '</b><small>' + f.stores + '곳 · ' + f.items + '</small></button>').join('') + '</div>';
    if (hits) {
      body += '<div class="list" style="margin-top:10px">' + (hits.length ? hits.slice(0, 50).map(n => '<button class="row" onclick="ehJump(\'' + n[0] + '\',\'' + n[2] + '\')"><span class="ehcnt">' + h(n[0]) + '</span><span class="fname"><b style="font-size:15px">' + h(n[1]) + '</b></span>' + ICON.chev + '</button>').join('') : '<div class="banner b-gray">「' + h(S.ehQ) + '」 매장이 없습니다.</div>') + '</div>';
    } else {
      body += '<div class="ehsum"><span><b>' + h(r.floor) + '</b> 매장 ' + fl.stores + '곳 · 기기 ' + fl.items + '대</span>' +

/* 필증 라벨 50×50mm (4장) — 오른쪽 아래 QR은 프린터 점에 맞춤 */
function ehFit(text, mm, max) { const u = Array.from(String(text)).reduce((n, c) => n + (/[\x00-\x7F]/.test(c) ? 0.56 : 1), 0); return Math.max(4.5, Math.min(max, (mm - 1.6) / Math.max(u, 1) / 0.353)).toFixed(1); }
function ehUrl(token) { return ((S.eh && S.eh.execUrl) || EXEC_URL) + '?eh=' + token; }
function ehLabel(i) {
  const q = qrImage(i.token, 16.6, ehUrl(i.token), 'L');
  const v = (t, mm, max, wide) => '<div class="v' + (wide ? ' wd' : '') + '" style="font-size:' + ehFit(t, mm, max) + 'pt">' + h(t) + '</div>';
  return '<div class="ehl"><div class="ehlh"><img class="ehlogo" src="' + EH_LOGO + '" alt=""><div class="ehlt"><b>전열기기 신고필증</b><span>롯데백화점 에비뉴엘 월드타워점</span></div></div>' +
    '<div class="ehg"><div class="k">관리번호</div>' + v(i.no, 32, 9, 1) + '<div class="k">사용장소</div>' + v(i.store.name, 32, 7.6, 1) + '<div class="k">책임자</div>' + v(i.m1, 32, 7.6, 1) +
    '<div class="k">승인일자</div>' + v(ehDate(i.date), 15.4, 7.6) + '<div class="q"><img src="' + q.src + '" style="width:' + q.mm + 'mm;height:' + q.mm + 'mm" alt=""></div>' +
    '<div class="k">용량(W)</div>' + v(ehW(i.w) + ' W', 15.4, 7.6) + '<div class="k">승인</div>' + v('시설소장', 15.4, 7.6) + '</div></div>';
}

  $('ehXb').disabled = true; $('ehXb').innerHTML = '<span class="spin"></span> 저장 중 (1~2분)';
  try { const r = await call('ehImport', S.ehX, true); if (!r.ok) { toast(r.error); $('ehXb').disabled = false; $('ehXb').textContent = '가져오기'; return; } closeDialog(); S.ehX = null; toast('매장 ' + r.check.stores + '곳 · 기기 ' + r.check.items + '대 가져옴'); ehSet(r); }
  catch (e) { $('ehXb').disabled = false; $('ehXb').textContent = '가져오기'; }
}

/* ── 그리기 ── */
function render() {
  let html;
  if (S.view === 'loading') html = renderLoading();
  else if (S.view === 'retry') html = renderRetry();
  else if (S.view === 'sign' && S.sign) html = renderSign();
  else if (!S.token || S.view === 'login') html = renderLogin();
  else if (S.view === 'docs') html = renderDocs();
  else if (S.view === 'tbm') html = renderTbm();
  else if (S.view === 'nw') html = renderNw();
  else if (S.view === 'att') html = renderAtt();
  else if (S.view === 'attup') html = renderAttUp();
  else if (S.view === 'inspect') html = renderInspect();
  else if (S.view === 'fire') html = renderFire();
  else if (S.view === 'qr') html = renderQr();
  else if (S.view === 'eh') html = renderEh();
  else if (S.view === 'status') html = renderStatus();
  else if (S.view === 'floor') html = S.st ? renderFloor() : renderStatus();
  else html = renderMain();
  $('app').innerHTML = html;
  if (S.view === 'qr') drawQrs();
  if (S.view === 'sign') mountSign();
}

(async function start() {
  render();   // 「불러오는 중」 — 저장된 표를 확인하는 동안 PIN 화면을 보이지 않음 (결정 48)
  if (!tokenAlive(S.token)) {
    store('ws_token', null); S.token = '';
    const t = await SHELL.get();
    if (tokenAlive(t)) { S.token = t; store('ws_token', t); }
  } else SHELL.set(S.token);
  if (!S.token) { S.view = 'login'; render(); return; }
  // 이 기기에 기억한 지난번 메인 화면을 먼저 보여 주고, 서버 확인은 뒤에서 (로딩 개선, 결정 76). 표의 주인이 같을 때만
  let m = null; try { m = JSON.parse(store('ws_main') || 'null'); } catch (e) {}
  if (m && m.user && m.sid === String(S.token).split('.')[0]) { S.user = m.user; S.fire = m.fire; S.docs = m.docs; S.cached = true; S.view = 'main'; render(); }
  await boot(true);
})();
</script>
