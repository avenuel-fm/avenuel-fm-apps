    } finally { window.scrollTo(0, keepY); }
  } finally { wrap.remove(); }
}

/* ── 명일 작업 예정 (WS_서류작업 9장, 결정 62·68) ── */
const NW_WORDS = ['고소작업', '사다리', '용접', '페인트'];   // 작업 내용·비고에 있으면 그 줄 전체 빨간색
const NW_DEPTS = ['전방파트', '기건파트'];
function nwDanger(r) { const t = (r.work || '') + ' ' + (r.note || ''); return NW_WORDS.some(w => t.indexOf(w) !== -1); }
function nwBlank() { return { dept: (S.user && NW_DEPTS.indexOf(S.user.part) !== -1) ? S.user.part : NW_DEPTS[0], place: '', work: '', note: '' }; }
function nwLeaveOk() { return !(S.nw && S.nw.dirty) || confirm('저장하지 않은 내용이 있습니다. 저장하지 않고 나갈까요?'); }

async function loadNw(date, quiet) {

function nwSet(r) {

/* 그림 파일(PNG) — 양식 v2 칸 순서 그대로, 색은 도면협의 디자인. 그림 칸 1000px를 2배(가로 2000px)로 그림 (결정 68) */
function nwDraw() {
  const n = S.nw, rows = nwFilled(), W = 1000, SC = 2, PAD = 32;
  const COLS = [['구 분', 160], ['순번', 52], ['부 서', 110], ['작업장소', 150], ['작업 내용', 0], ['비 고', 130]];
  COLS[4][1] = W - PAD * 2 - COLS.reduce((a, c) => a + c[1], 0);
  const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = (w, px) => { g.font = w + ' ' + px + 'px ' + FONT; };
  function wrap(t, maxW) {   // 칸 너비에 맞춰 글자 단위로 줄바꿈
    font(400, 15); const out = []; let line = '';
    for (const ch of String(t || '')) { if (g.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; } else line += ch; }
    out.push(line); return out;
  }
  const cells = rows.map((r, i) => [String(i + 1), r.dept, r.place, r.work, r.note].map((t, j) => wrap(t, COLS[j + 1][1] - 20)));
  const rowH = cells.map(c => Math.max(38, 14 + Math.max(...c.map(l => l.length)) * 22));
  const tableY = 118, headH = 40, bodyH = Math.max(rowH.reduce((a, b) => a + b, 0), 76), H = tableY + headH + bodyH + 72;
  cv.width = W * SC; cv.height = H * SC; g.scale(SC, SC);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.textBaseline = 'middle';
  font(700, 20); g.fillStyle = '#18202B'; g.fillText('■ 에비뉴엘 시설팀 명일 작업 일정 현황', PAD, 44);
  const [yy, mm, dd] = n.date.split('-');
  let x = PAD; font(700, 16);
  const put = (t, box) => {
    const w = g.measureText(t).width + (box ? 24 : 0);
    if (box) { g.fillStyle = '#E8F0FA'; rr(x, 70, w, 32, 8); g.fill(); g.fillStyle = '#174A84'; g.fillText(t, x + 12, 87); } else { g.fillStyle = '#18202B'; g.fillText(t, x, 87); }
    x += w + 8;
  };
  put('일자 :'); put(yy, 1); put('년'); put(String(Number(mm)), 1); put('월'); put(String(Number(dd)), 1); put('일');
  function rr(x0, y0, w, hh, r) { g.beginPath(); g.moveTo(x0 + r, y0); g.arcTo(x0 + w, y0, x0 + w, y0 + hh, r); g.arcTo(x0 + w, y0 + hh, x0, y0 + hh, r); g.arcTo(x0, y0 + hh, x0, y0, r); g.arcTo(x0, y0, x0 + w, y0, r); g.closePath(); }
  const TW = W - PAD * 2, TH = headH + bodyH;
  g.save(); rr(PAD, tableY, TW, TH, 12); g.clip();
  g.fillStyle = '#E8F0FA'; g.fillRect(PAD, tableY, TW, headH);
  g.fillStyle = '#F8FAFC'; g.fillRect(PAD, tableY + headH, COLS[0][1], bodyH);
  const colX = []; let cx = PAD; COLS.forEach(c => { colX.push(cx); cx += c[1]; });
  font(700, 15); g.fillStyle = '#174A84'; g.textAlign = 'center';
  COLS.forEach((c, j) => g.fillText(c[0], colX[j] + c[1] / 2, tableY + headH / 2));
  let y = tableY + headH;
  cells.forEach((c, i) => {
    const red = nwDanger(rows[i]);
    if (red) { g.fillStyle = '#FFF4F3'; g.fillRect(colX[1], y, TW - COLS[0][1], rowH[i]); }
    if (i) { g.fillStyle = '#EDF0F3'; g.fillRect(colX[1], y, TW - COLS[0][1], 1); }
    font(400, 15); g.fillStyle = red ? '#C0261A' : '#18202B';
    c.forEach((lines, j) => {
      const col = j + 1, left = col === 4;
      g.textAlign = left ? 'left' : 'center';
      const top = y + rowH[i] / 2 - (lines.length - 1) * 11;
      lines.forEach((l, k) => g.fillText(l, left ? colX[col] + 10 : colX[col] + COLS[col][1] / 2, top + k * 22));
    });
    y += rowH[i];
  });
  g.fillStyle = '#EDF0F3'; colX.slice(1).forEach(cx2 => g.fillRect(cx2, tableY + (cx2 === colX[1] ? 0 : 0), 1, TH));
  g.fillStyle = '#CBD2DB'; g.fillRect(PAD, tableY + headH - 1, TW, 1);
  font(500, 15); g.fillStyle = '#3F4855'; g.textAlign = 'center';
  g.fillText('㈜맥서브', PAD + COLS[0][1] / 2, tableY + headH + bodyH / 2 - 12); g.fillText('에비뉴엘 잠실점', PAD + COLS[0][1] / 2, tableY + headH + bodyH / 2 + 12);
  g.restore();
  g.strokeStyle = '#CBD2DB'; g.lineWidth = 1; rr(PAD + .5, tableY + .5, TW - 1, TH - 1, 12); g.stroke();
  g.textAlign = 'left'; font(400, 14); g.fillStyle = '#C0261A';
  g.fillText('※ 사다리, 위험물작업(용접·페인트) 작업은 빨간색으로 표시', PAD, tableY + TH + 28);
  return cv;
}

/* ── 개선 A: 입력 기간 안내 ── */
function periodBanner(st, counts) {
  if (!st) return '';
  const w = st.window, d = st.day, m = Number(st.ym.slice(5, 7));
  if (!st.isCurrent) return st.ym < st.curYm ? '<div class="banner b-gray">' + ymLabel(st.ym) + ' · 입력 기간 ' + m + '/' + w.start + '~' + m + '/' + w.end + ' · 마감됨</div>' : '';
  if (d < w.start) return '<div class="banner b-gray">이번 달 입력은 ' + m + '월 ' + w.start + '일부터 받습니다.</div>';
  if (d <= w.end) {
    const left = w.end - d;
    if (counts.wait > 0 && left <= 1) return '<div class="banner b-warn"><b>마감 임박</b> · ' + m + '월 ' + w.end + '일까지 · 점검 전 <b>' + counts.wait + '대</b></div>';
    return '<div class="banner b-info">이번 달 입력 기간 ' + m + '월 ' + w.start + '일 ~ ' + w.end + '일 · ' + (left === 0 ? '오늘 마감' : left + '일 남음') + ' · 점검 전 ' + counts.wait + '대</div>';
  }
  if (counts.miss > 0) return '<div class="banner b-red"><b>기한 지남</b> · 미입력 ' + counts.miss + '대 · 지금 입력해도 받고 「기한 후」로 표시합니다</div>';
  return '<div class="banner b-gray">이번 달 입력 기간이 끝났습니다.</div>';
}

/* ── 소화기 점검 메뉴 ── */

/* ── ① QR 관리 ── */
async function openQr() { go('qr'); await loadQr(); }
async function loadQr() {
  const r = await call('feList');
  S.qr = r; S.sel = {};
  render();
}
function qrUrl(token) { return (S.qr && S.qr.execUrl ? S.qr.execUrl : EXEC_URL) + '?fe=' + token; }
function renderQr() {
  const r = S.qr;
  const selN = Object.keys(S.sel).filter(k => S.sel[k]).length;
  let body = '<div class="banner b-gray">불러오는 중…</div>';
  if (r) {
    const q = S.q.trim().toLowerCase().replace(/\s+/g, '');
    const items = r.items.filter(i => !q || (i.store + i.name + i.floor).toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1);
    if (!items.length) body = '<div class="banner b-gray">' + (r.items.length ? '검색 결과가 없습니다.' : '등록된 소화기가 없습니다. [+ 등록]으로 추가하세요.') + '</div>';
    else {
      body = '';
      FLOORS.forEach(fl => {
        const fItems = items.filter(i => i.floor === fl);
        if (!fItems.length) return;
        body += '<div class="floorh">' + fl + '</div>';
        const stores = [...new Set(fItems.map(i => i.store))];
        stores.forEach(s => {
          const list = fItems.filter(i => i.store === s);
          body += '<div class="store"><div class="store-h"><b>' + h(s) + '</b><small style="color:var(--muted)">' + list.length + '대</small></div>' +
            list.map(i => '<div class="fe"><input type="checkbox" aria-label="' + h(i.name) + ' 고르기" ' + (S.sel[i.id] ? 'checked' : '') + ' onchange="S.sel[\'' + i.id + '\']=this.checked;render()">' +
              '<button class="qrmini" data-qr="' + h(i.token) + '" onclick="bigQr(\'' + i.id + '\')" aria-label="' + h(i.name) + ' QR 크게 보기"></button>' +
              '<span class="fname"><b>' + h(i.name) + '</b><small>' + h(i.id) + '</small></span></div>').join('') + '</div>';
        });
      });
    }
  }
  return topbar('소화기 점검 ›', '소화기 QR 관리') + '<div class="wrap list">' +
    '<div class="tools"><input class="inp" type="search" placeholder="매장명 · 소화기 이름 · 층 검색" aria-label="검색" value="' + h(S.q) + '" oninput="S.q=this.value;renderKeepFocus(this)">' +
    '<button class="btn pri" onclick="addDialog()">+ 등록</button>' +
    (CAN_PRINT ? '<button class="btn" onclick="printLabels()" ' + (selN ? '' : 'disabled') + '>' + ICON.print + ' 출력 (' + selN + ')</button>' : '') +
    '<button class="btn warn" onclick="delDialog()" ' + (selN ? '' : 'disabled') + '>삭제 (' + selN + ')</button></div>' +
    (CAN_PRINT ? '' : '<div class="banner b-gray">QR 출력은 PC 화면에서 합니다. 휴대폰에서는 등록과 삭제만 됩니다.</div>') +

const LABEL_PRESETS = [[50, 50], [40, 40], [30, 34], [50, 30]];
// 라벨 프린터: BIXOLON SLP-TX400 (203dpi = 8점/mm). QR 한 칸이 프린터 점(dot) 정수 배가 되게 그려 흐림 없이 찍히게 함
function labelDpi() { return (S.qr && S.qr.label && Number(S.qr.label.dpi)) || 203; }
function qrMatrix(token) {
  S.qrm = S.qrm || {};
  if (S.qrm[token]) return S.qrm[token];
  const tmp = document.createElement('div');
  const q = new QRCode(tmp, { text: qrUrl(token), width: 64, height: 64, correctLevel: QRCode.CorrectLevel.M });

// 원하는 크기(mm) 안에서 가장 큰 「점 정수 배」 QR 그림 → {src, mm}
function qrImage(token, maxMm) {

  const scale = 4, cv = document.createElement('canvas');   // 화면 미리보기도 또렷하게 4배로 그림
  cv.width = cv.height = per * total * scale;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#000';
  const u = per * scale;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (rows[r][c]) g.fillRect((c + quiet) * u, (r + quiet) * u, u, u);
  return { src: cv.toDataURL('image/png'), mm: +(per * total / dpi * 25.4).toFixed(3) };
}
function labelHtml(i, L) {

  const pad = 1.5, gap = 0.8, textMm = 2.8;

  const q = qrImage(i.token, maxMm);

  const pt = Math.max(4.5, Math.min(7, (L.w - pad * 2) / Math.max(units, 1) / 0.353));
  return '<div class="label" style="width:' + L.w + 'mm;height:' + L.h + 'mm"><b style="font-size:' + pt.toFixed(1) + 'pt">' + h(name) + '</b><img src="' + q.src + '" style="width:' + q.mm + 'mm;height:' + q.mm + 'mm" alt=""></div>';

  else html = renderMain();
  $('app').innerHTML = html;
  if (S.view === 'qr') drawQrs();
  if (S.view === 'sign') mountSign();
}

(async function start() {
  render();   // 「불러오는 중」 — 저장된 표를 확인하는 동안 PIN 화면을 보이지 않음 (결정 48)
  if (!tokenAlive(S.token)) {
    store('ws_token', null); S.token = '';
    const t = await SHELL.get();
    if (tokenAlive(t)) { S.token = t; store('ws_token', t); }
  } else SHELL.set(S.token);
  if (!S.token) { S.view = 'login'; render(); return; }
  // 이 기기에 기억한 지난번 메인 화면을 먼저 보여 주고, 서버 확인은 뒤에서 (로딩 개선, 결정 76). 표의 주인이 같을 때만
  let m = null; try { m = JSON.parse(store('ws_main') || 'null'); } catch (e) {}
  if (m && m.user && m.sid === String(S.token).split('.')[0]) { S.user = m.user; S.fire = m.fire; S.docs = m.docs; S.cached = true; S.view = 'main'; render(); }
  await boot(true);
})();
</script>
</body>
</html>
