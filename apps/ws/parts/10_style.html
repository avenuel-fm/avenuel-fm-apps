.nwdel{width:44px;padding:0;color:var(--muted)}

.nwrow.danger{background:var(--tint);box-shadow:none}

.nwhd{display:none}

.nwstate{display:inline-flex;align-items:center;gap:var(--sp-1)}

.nwbar{position:sticky;bottom:0;z-index:15;background:var(--white);border-top:1px solid var(--line2);margin:0 calc(var(--sp-4) * -1);padding:var(--sp-2) var(--sp-4) calc(var(--sp-2) + env(safe-area-inset-bottom));display:flex;gap:var(--sp-2);align-items:center}

.sec{font-size:var(--size-s);font-weight:600;color:var(--muted);margin:var(--sp-2) var(--sp-1) calc(var(--sp-1) * -1)}

.s-ya{background:var(--tint);color:var(--blue-d)}.s-bi{background:var(--tint);color:var(--text-sub)}.s-sick{background:var(--tint);color:var(--navy)}
.s-ban{color:var(--navy);border-color:var(--line)}.s-gj{background:var(--tint);color:var(--navy)}.s-etc{color:var(--muted);border:1px dashed var(--line)}
