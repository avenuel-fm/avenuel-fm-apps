<style>
/* DESIGN-TOKENS:START */
/* 디자인 값은 이 파일에만 적습니다. 고친 뒤 python apps/design/sync.py 를 돌리면 모든 앱에 들어갑니다. */
:root{
  /* 기본 색 6가지 */
  --navy:#1E3A5F;     /* 주 색상: 머리줄, 주요 버튼, 강조 숫자, 그래프 */
  --white:#FFFFFF;    /* 바탕 */
  --text-sub:#5F6B7A; /* 보조 글자 */
  --line:#D8DDE5;     /* 구역을 나누는 선, 입력칸 테두리 */
  --tint:#F1F4F8;     /* 고른 줄, 표 머리 */
  --error:#B42318;    /* 오류 문구 전용 */

  /* 글자 크기 */
  --size-s:13px; --size-m:15px; --size-l:18px; --size-xl:24px; --size-xxl:32px;
  --size-input-touch:16px; /* 휴대폰 입력칸 전용: 16px보다 작으면 아이폰이 화면을 저절로 확대함 */

  /* 간격 (4의 배수) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;

  /* 모양 */
  --radius:2px;          /* 모든 모서리 */
  --control-h:40px;      /* 버튼, 입력칸 높이 */
  --control-h-touch:44px;/* 휴대폰의 버튼, 입력칸 높이 */

  /* 팝업 뒤를 어둡게 하는 막 (남색 45%) */
  --overlay:rgba(30,58,95,.45);
  --font:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
@media (pointer:coarse){
  :root{--control-h:var(--control-h-touch)}
  input:not([type=checkbox]):not([type=radio]):not(.lgin),textarea:not(.lgin),select:not(.lgin){font-size:var(--size-input-touch)!important}
}

/* 인쇄·PDF·라벨 양식은 종이 기준이라 원래 색을 그대로 씁니다 (화면 디자인 규칙에서 제외) */
#print,.tbp,.cspdf,.label,.ehl,.ehlt,.ehg,.hvs,.lgs,.page,.ag-paper,.ag-page{
  color:#18202B;
  --ink:#18202B; --ink2:#2A3340; --sub:#3F4855; --muted:#5B6573; --faint:#7A8494;
  --line:#CBD2DB; --line2:#DCE1E7; --line3:#EDF0F3; --ground:#F4F6F8; --card:#FFFFFF;
  --blue:#1F5FA8; --blue-d:#174A84; --blue-bg:#E8F0FA;
  --green:#1F7A4D; --green-d:#155C39; --green-bg:#EAF5EF;
  --orange:#B4410F; --orange-bg:#FDF0E8; --red:#C0261A; --red-bg:#FBE9E7;
}
/* DESIGN-TOKENS:END */
:root{ /* 예전 이름 → 기본 색 6가지 */
  --ink:var(--navy); --ink2:var(--navy); --sub:var(--text-sub); --muted:var(--text-sub); --faint:var(--text-sub);
  --line2:var(--line); --line3:var(--line); --ground:var(--white); --card:var(--white);
  --blue:var(--navy); --blue-d:var(--navy); --blue-bg:var(--tint);
  --green:var(--navy); --green-d:var(--navy); --green-bg:var(--tint);
  --orange:var(--navy); --orange-bg:var(--tint); --red:var(--error); --red-bg:var(--tint);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* 공통 버튼·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--control-h);padding:0 var(--sp-4);border-radius:var(--radius);border:1px solid var(--line);background:var(--white);font-size:var(--size-m);font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.btn:hover{background:var(--tint)}}
.btn:focus-visible,.seg button:focus-visible,.chk:focus-visible,.cf:focus-visible,.tab:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--white)}
@media (hover:hover){.btn.pri:hover{background:var(--blue-d)}}
.btn.green{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.warn{background:var(--orange);border-color:var(--orange);color:var(--white)}
.btn.sm{min-height:var(--control-h);padding:0 var(--sp-3);font-size:var(--size-s)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.busy{cursor:progress;opacity:.85}
.btn .spin{width:16px;height:16px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn .spin{animation-duration:2s}}
@media (prefers-reduced-motion:no-preference){.btn{transition:scale .15s ease-out}.btn:not([disabled]):active{scale:.96}}
.icon-btn{width:var(--control-h);min-width:var(--control-h);flex:none;padding:0}
.lbl{display:block;font-size:var(--size-s);font-weight:500;color:var(--sub);margin-bottom:var(--sp-1)}
.inp{width:100%;height:var(--control-h);padding:0 var(--sp-3);border:1px solid var(--line);border-radius:var(--radius);font-size:var(--size-m);background:var(--white);color:var(--ink)}
.inp::placeholder,textarea::placeholder{color:var(--faint)}
.inp:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:none}
.inp[disabled],textarea[disabled]{background:var(--tint);color:var(--sub)}
.uw{position:relative}
.uw .inp{padding-right:56px}
.sfx{position:absolute;right:12px;top:12px;font-size:var(--size-m);color:var(--muted);pointer-events:none}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:var(--control-h);background:var(--white)}
.seg button{flex:1;border:0;background:var(--white);font-size:var(--size-m);color:var(--sub);min-width:52px;padding:0 var(--sp-2);cursor:pointer;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--blue);color:var(--white);font-weight:500}
.seg button[disabled]{cursor:not-allowed}
.seg button[disabled]:not(.on){color:var(--faint)}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--white);border-bottom:1px solid var(--navy)}
.topbar .tb-title .t1,.topbar .tb-title .t2,.topbar .savestate,.topbar .savestate.ok,.topbar .savestate.dirty{color:var(--white)}
.topbar .btn.pri{background:var(--white);border-color:var(--white);color:var(--navy)}
.topbar-in{max-width:1280px;margin:0 auto;padding:var(--sp-3) var(--sp-6);display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3) var(--sp-4)}
.tb-title{display:flex;align-items:center;gap:var(--sp-2);flex:1 1 300px;min-width:0}
.tb-title .t1{font-size:var(--size-s);color:var(--muted)}
.tb-title .t2{font-size:var(--size-l);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2)}
.chip{flex:none;font-size:var(--size-s);font-weight:500;border-radius:var(--radius);padding:var(--sp-1) var(--sp-2)}
.chip.orange{color:var(--orange);background:var(--orange-bg)}
.chip.green{color:var(--green-d);background:var(--green-bg)}
.chip.blue{color:var(--blue-d);background:var(--blue-bg)}
.savestate{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--size-s);color:var(--muted);margin-right:var(--sp-1)}
.savestate.ok{color:var(--green)}
.savestate.dirty{color:var(--orange)}

/* 역할 선택 (소장/부소장) */
.roles{display:flex;gap:var(--sp-1)}
.chk{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:var(--control-h);padding:0 var(--sp-3);border:1px solid var(--line);background:var(--white);border-radius:var(--radius);font-size:var(--size-m);color:var(--sub);cursor:pointer}
.chk .box{width:18px;height:18px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--white);display:inline-flex;align-items:center;justify-content:center}
.chk.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d);font-weight:500}
.chk.on .box{background:var(--blue);border-color:var(--blue)}

/* 레이아웃 */
.wrap{max-width:1280px;margin:0 auto;padding:var(--sp-4) var(--sp-6) var(--sp-8)}
.card{background:var(--white);border:1px solid var(--line2);border-radius:var(--radius);padding:var(--sp-6)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:var(--sp-4) var(--sp-4)}
/* 1.8 전기용량 · 전원 방식(넓게) · 메인차단기 한 줄 */
.grid.elecrow{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr) minmax(0,1fr)}
.elecrow .seg button{padding:0 var(--sp-1);white-space:nowrap}
@media (max-width:1100px){.elecrow .seg button{font-size:var(--size-s)}}
@media (max-width:760px){.grid.elecrow{grid-template-columns:1fr}.elecrow .seg button{font-size:var(--size-m);white-space:normal;line-height:1.25;padding:var(--sp-1) var(--sp-1)}}
.sub{margin:var(--sp-6) 0 var(--sp-3);font-size:var(--size-m);font-weight:600;padding-bottom:var(--sp-2);border-bottom:1px solid var(--line3)}
.sub.first{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:var(--size-s)}

/* 로그인 */
/* 1.8 할 일 · 표시 · 업체 이력 · 서류 요청 · 발송 기록 */
.todos{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;margin:var(--sp-3) 0 var(--sp-3)}
.todos:empty{display:none}
.todos .lb{font-size:var(--size-s);color:var(--muted);margin-right:var(--sp-1)}
.todo{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:44px;padding:0 var(--sp-2);border:0;border-radius:var(--radius);background:none;font:inherit;font-size:var(--size-m);font-weight:600;cursor:pointer}
.todo b{font-size:var(--size-m)}.todo.pu{color:var(--navy)}.todo.or{color:var(--navy)}.todo.rd{color:var(--navy)}
@media (hover:hover){.todo:hover{background:var(--ground)}}
.todo.pick{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.todo-none{font-size:var(--size-m);color:var(--green-d,var(--navy));font-weight:600}
.filterchip{display:inline-flex;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-2);padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3);border-radius:var(--radius);background:var(--tint);color:var(--navy);font-size:var(--size-s);font-weight:500}
.filterchip.or{background:var(--tint);color:var(--navy)}.filterchip.rd{background:var(--tint);color:var(--navy)}
.filterchip button{border:0;background:none;color:inherit;font-size:var(--size-m);cursor:pointer;min-width:32px;min-height:var(--control-h)}
.schip.doc{background:var(--tint);color:var(--navy)}.schip.hj{background:var(--tint);color:var(--navy)}.schip.fd{background:var(--tint);color:var(--navy)}
.vlink{border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:var(--size-s);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;text-align:left}
@media (hover:hover){.vlink:hover{color:var(--blue)}}
@media (pointer:coarse){.vlink{display:inline-block;min-height:32px;padding:var(--sp-1) 0}}
.vstat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2);margin-top:var(--sp-3)}.vstat div{background:var(--tint);border-radius:var(--radius);padding:var(--sp-2);font-size:var(--size-s);color:var(--muted)}.vstat b{display:block;font-size:var(--size-l);color:var(--ink)}
.vwrap{overflow-x:auto;margin-top:var(--sp-3)}
.vtbl{width:100%;border-collapse:collapse;font-size:var(--size-s);min-width:460px}.vtbl th{background:var(--tint);color:var(--muted);font-weight:500;text-align:left;padding:var(--sp-2)}.vtbl td{border-top:1px solid var(--line3);padding:var(--sp-2)}
.vstore{border:0;background:none;padding:0;color:var(--blue);font:inherit;font-weight:500;cursor:pointer;text-align:left;min-height:32px}
@media (max-width:520px){.vstat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn.docreq{margin-top:var(--sp-2);border-color:var(--navy);color:var(--navy)}
.sendlog{margin-top:var(--sp-4);border:1px solid var(--line2);border-radius:var(--radius);background:var(--white);overflow:hidden}
.sendlog .hd{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--tint);font-weight:500;font-size:var(--size-m)}
.sendlog .hd .c{font-weight:400;color:var(--muted);font-size:var(--size-s)}
.sendlog ul{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto;overscroll-behavior:contain}
.sendlog li{display:grid;grid-template-columns:118px 84px minmax(0,1fr);gap:var(--sp-2);align-items:start;padding:var(--sp-2) var(--sp-3);border-top:1px solid var(--line3);font-size:var(--size-s)}
.sendlog li>span:last-child{overflow-wrap:anywhere}
.sendlog .dt{color:var(--sub);white-space:nowrap}.sendlog .tg{display:inline-block;padding:var(--sp-1) var(--sp-2);border-radius:var(--radius);font-size:var(--size-s);font-weight:500;text-align:center}
.tg.sp{background:var(--tint);color:var(--navy)}.tg.dc{background:var(--tint);color:var(--navy)}.tg.sg{background:var(--tint);color:var(--navy)}.tg.hj{background:var(--tint);color:var(--navy)}.tg.pdf{background:var(--tint);color:var(--sub)}
.sendlog .who{color:var(--muted);font-size:var(--size-s)}.sendlog a{color:var(--blue)}
@media (max-width:640px){.sendlog li{grid-template-columns:1fr auto}.sendlog li>span:last-child{grid-column:1/-1}}
/* 출력물 2쪽: 직전 차수 대비 변경 */
.pchg{border:1px solid var(--ink);margin-top:14px}.pchg .hd{background:#EEF1F4;border-bottom:1px solid var(--ink);padding:5px 10px;font-size:11px;font-weight:500}
.pchg ul{margin:0;padding:6px 14px 8px 28px;font-size:11px;line-height:1.65;columns:2;column-gap:24px}.pchg b{color:#C0261A}.pchg .more{color:var(--muted)}.pchg .none{padding:6px 12px;font-size:11px;color:var(--muted)}
/* 1.8 원격 서명 */
.sreqw{margin-top:var(--sp-1)}.sreqw:empty{display:none}
.sreq{display:inline-flex;align-items:center;gap:var(--sp-1);border:1px solid var(--navy);color:var(--navy);background:var(--white);border-radius:var(--radius);min-height:32px;padding:var(--sp-1) var(--sp-2);font:inherit;font-size:var(--size-s);font-weight:500;cursor:pointer;text-align:left}
.sreq.wait{border-color:var(--line);color:var(--navy);background:var(--tint)}
.sfile input.sremail{display:block;width:100%;height:auto;box-sizing:border-box;margin:var(--sp-1) 0 0;min-height:var(--control-h);accent-color:auto}
.signpg{max-width:560px;margin:0 auto;padding:var(--sp-4) var(--sp-4) var(--sp-8);min-height:100vh;min-height:100dvh}
.signpg h1{font-size:var(--size-l);margin:var(--sp-1) 0 var(--sp-1)}
.sp-card{padding:var(--sp-4);margin-top:var(--sp-3);font-size:var(--size-m);line-height:1.8}
.sp-h{font-weight:600}
.sp-pdf{display:flex;justify-content:center;margin-top:var(--sp-3);min-height:46px;text-decoration:none}
.sp-padwrap{position:relative;margin-top:var(--sp-2)}
canvas.pen-on{cursor:crosshair}
.sp-padwrap .sp-pad{margin-top:0}
/* 서명 안내 영상(PC 전용, DW-4): 서명칸 위에 덮음 · 클릭은 아래 서명칸으로 통과 · 좌우 여백은 영상 바탕색 */
.sp-pad{display:block;width:100%;height:200px;margin-top:var(--sp-2);border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--white);touch-action:none;cursor:crosshair}
.sp-btns{display:flex;gap:var(--sp-2);margin-top:var(--sp-3)}.sp-btns .btn{flex:1;min-height:var(--control-h)}.sp-btns .btn.pri{flex:2}
.sp-err{color:var(--navy);margin-top:var(--sp-2);min-height:18px}
.sp-foot{margin-top:var(--sp-3);text-align:center}
.sp-done{padding:var(--sp-6) var(--sp-4)}
/* 1.7 PIN 팝업 */
.pinpop{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--sp-4);background:var(--overlay)}
.pinpop .pinbox{position:static;width:100%;max-width:380px;text-align:center}
.pinbox .lock{width:56px;height:56px;border-radius:var(--radius);background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:var(--size-xl);margin:0 auto var(--sp-3)}
.pinbox h1{font-size:var(--size-l);margin:var(--sp-1) 0 0}
.pinbox .pin{font-size:var(--size-xl);letter-spacing:10px;text-align:center;margin-top:var(--sp-2)}
.pinbox .err{min-height:20px;margin-top:var(--sp-1)}
.pinbox .btn{width:100%;min-height:var(--control-h);font-size:var(--size-m);margin-top:var(--sp-1)}
.pinbox .btn.devoff{min-height:var(--control-h);font-size:var(--size-s);margin-top:var(--sp-2);border-color:transparent;background:transparent;color:var(--muted)}
.whoami{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:40px;padding:0 var(--sp-3);border-radius:var(--radius);background:var(--tint);color:var(--blue);font-size:var(--size-m);font-weight:500;white-space:nowrap}
/* 대시보드 차수 · 컨펌완료 · 소장 확인 한 줄 */
.stepsrow{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:nowrap}
.cfpair{display:inline-flex;align-items:center;gap:var(--sp-1);flex-wrap:nowrap}
@media (max-width:1279px){.stepsrow{flex-wrap:wrap}}
@media (min-width:1280px){.tbl td.c-act{white-space:normal!important}.tbl td.c-act .btn{margin-top:var(--sp-1);margin-bottom:var(--sp-1)}}
@media (min-width:1101px) and (max-width:1279px){.tbl td.c-act{white-space:normal!important;min-width:0!important;width:150px}.tbl td.c-act .btn{margin:var(--sp-1) 0 var(--sp-1) var(--sp-1)}}
.stepsrow .cf{min-height:32px;min-width:100px;padding:0 var(--sp-1);font-size:var(--size-s);gap:var(--sp-1);justify-content:center}
.stepsrow .st{width:36px}
.stepsrow .cf svg{width:12px;height:12px;flex:none}
.cf.chief{border-color:var(--line);color:var(--text-sub);background:var(--tint);cursor:default}
.cf.chief.on{border-color:var(--green);background:var(--green);color:var(--white)}
/* 9번 소장 확인 */
.chiefbox{display:inline-flex;align-items:center;gap:var(--sp-3);min-height:56px;padding:var(--sp-3) var(--sp-4);border:1.5px solid var(--line);border-radius:var(--radius);background:var(--tint);font-size:var(--size-m);font-weight:500;color:var(--navy);cursor:pointer}
.chiefbox input{width:24px;height:24px;margin:0;accent-color:#2E8B57}
.chiefbox.off{opacity:.6;cursor:not-allowed}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--sp-6)}
.login .card{width:100%;max-width:420px;padding:var(--sp-8)}
.login h1{font-size:var(--size-xl);margin:var(--sp-1) 0 var(--sp-6)}
.err{margin-top:var(--sp-3);color:var(--red);font-size:var(--size-m);min-height:20px}

/* 대시보드 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:var(--sp-3)}
.kpi{background:var(--white);border:1px solid var(--line2);border-radius:var(--radius);padding:var(--sp-4) var(--sp-4)}
.kpi .k{font-size:var(--size-s);color:var(--muted)}
.kpi .n{font-size:var(--size-xxl);font-weight:600;margin-top:var(--sp-1)}
.kpi.done{border-color:var(--line);background:var(--tint)}

.page{-webkit-text-size-adjust:100%;text-size-adjust:100%;width:794px;height:1123px;padding:34px 36px 28px;background:#fff;color:var(--ink);display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.12);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.f{width:100%;border-collapse:collapse;table-layout:fixed}
.f td{border:1px solid var(--ink);padding:3px 6px;font-size:11px;line-height:1.4;height:20px;vertical-align:middle;word-break:keep-all;overflow-wrap:anywhere}
.f .h{background:#EEF1F4;text-align:center;font-weight:500}
.f .c{text-align:center}
.f .xs{font-size:10px;line-height:1.25}
.f .title{height:46px;text-align:center;font-size:22px;font-weight:700;letter-spacing:1px}
.off{color:#9AA4B2}
.sel{font-weight:700;color:var(--ink);display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:0 6px;line-height:15px}
.u{color:var(--muted);float:right;margin-left:6px}
.r{color:var(--red);font-weight:700}
.prules{margin:0;padding:4px 2px 4px 16px;font-size:10.5px;line-height:1.55;font-weight:700}
.prules li{margin-bottom:2px}
.prules .subl{font-weight:400}
.nbox{overflow:hidden;position:relative}
.pbody{flex:none}
.pnote{margin-top:8px;font-size:10px;color:var(--ink)}
/* 특이사항 글: 글자 16px 로 놓고 11/16 로 줄임 → 편집칸과 줄바꿈이 똑같음 */
.nin{position:relative;overflow:hidden;width:calc(692px * 16 / 11);transform:scale(0.6875);transform-origin:0 0;font-family:'Noto Sans KR',sans-serif;font-size:16px;line-height:calc(19px * 16 / 11);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
.nin p,.nmirror p{margin:0}
.pph{position:absolute;overflow:hidden;z-index:2}
.pph img{position:absolute;left:50%;top:50%;max-width:none}
.ref-mark{position:absolute;right:8px;bottom:6px;font-size:10.5px;font-weight:700;border:1px solid var(--ink);padding:1px 8px;background:#fff}
.pfoot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;gap:12px;font-size:9px;color:var(--muted)}
.psig img{max-height:28px;max-width:110px;display:block;margin:0 auto}

@media (max-width:900px){
  .edit-row{gap:var(--sp-4)}
  .nav{flex-basis:100%;display:flex;align-items:center;gap:var(--sp-1);overflow-x:auto;padding:var(--sp-2);position:static;-webkit-overflow-scrolling:touch}
  .nav>div.small{white-space:nowrap;padding:0 var(--sp-1)!important;flex:none}
  .nav .prog{display:none}
  .nav a{flex:none;border:1px solid var(--line2);border-radius:var(--radius);min-height:44px;padding:0 var(--sp-3) 0 var(--sp-2);white-space:nowrap}
}
@media (max-width:640px){
  .topbar-in,.wrap{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .card{padding:var(--sp-4)}
  .tb-title .t2{font-size:var(--size-l)}
  .nav{position:static}
}

@page{size:A4;margin:0}


/* ───────── 특이사항 편집칸 (출력과 같은 줄바꿈) · 사진 ───────── */
.ntop{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-2)}
.nzoom{display:inline-flex;align-items:center;gap:var(--sp-1)}
.nzoom .btn{min-height:var(--control-h)}
.nwrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);padding:var(--sp-3);-webkit-overflow-scrolling:touch}
.nwrap:focus-within{border-color:var(--blue);box-shadow:none}
.nsize{position:relative}
.npaper{position:absolute;left:0;top:0;width:calc(692px * 16 / 11);transform-origin:0 0;font-family:'Noto Sans KR',sans-serif;font-size:var(--size-m);line-height:calc(19px * 16 / 11);color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(19px * 16 / 11 - 1px),var(--tint) calc(19px * 16 / 11 - 1px),var(--tint) calc(19px * 16 / 11))}
.npaper.drop{outline:4px dashed var(--blue);outline-offset:4px}
.npt{display:block;position:relative;z-index:1;width:100%;min-height:0;margin:0;padding:0;border:0;outline:none;box-shadow:none!important;resize:none;overflow:hidden;background:transparent;
  font:inherit!important;line-height:inherit!important;color:inherit;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;border-radius:0}
.npt::placeholder{color:var(--faint)}
.nmirror{position:absolute;left:0;top:0;width:100%;visibility:hidden;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;pointer-events:none}
.nphotos{position:absolute;left:0;top:0;width:100%;height:0;z-index:3}
.nph{position:absolute;touch-action:none;cursor:move;outline:none;user-select:none;-webkit-user-select:none}
.nph img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;-webkit-user-drag:none}
.nph.picked{box-shadow:none}
.nph.up{cursor:progress}
.nph-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--white);font-size:calc(var(--size-s) * var(--k,1));color:var(--sub)}
.nph-del{position:absolute;right:calc(-15px * var(--k,1));top:calc(-15px * var(--k,1));width:calc(30px * var(--k,1));height:calc(30px * var(--k,1));border-radius:var(--radius);border:0;background:var(--navy);color:var(--white);font-size:calc(var(--size-m) * var(--k,1));line-height:1;cursor:pointer;padding:0}
.nph-rs{position:absolute;right:calc(-12px * var(--k,1));bottom:calc(-12px * var(--k,1));width:calc(24px * var(--k,1));height:calc(24px * var(--k,1));border-radius:var(--radius);background:var(--white);border:calc(3px * var(--k,1)) solid var(--blue);cursor:nwse-resize;touch-action:none;box-sizing:border-box}
.nph-rot{position:absolute;left:50%;bottom:calc(-42px * var(--k,1));transform:translateX(-50%);display:flex;gap:calc(var(--sp-1) * var(--k,1))}
.nph-rot button{width:calc(34px * var(--k,1));height:calc(32px * var(--k,1));border-radius:calc(var(--radius) * var(--k,1));border:1px solid var(--line);background:var(--white);font-size:calc(var(--size-l) * var(--k,1));line-height:1;cursor:pointer;padding:0;box-shadow:none;color:var(--ink)}
@media (pointer:coarse){
  .nph-rs{width:calc(34px * var(--k,1));height:calc(34px * var(--k,1));right:calc(-17px * var(--k,1));bottom:calc(-17px * var(--k,1))}
  .nph-del{width:calc(38px * var(--k,1));height:calc(38px * var(--k,1))}
  .nph-rot button{width:calc(42px * var(--k,1));height:calc(38px * var(--k,1))}
  .nph-rot{bottom:calc(-48px * var(--k,1))}
}
.nbreaks{position:absolute;left:0;top:0;width:100%;height:0;z-index:2;pointer-events:none}
.nbrk{position:absolute;left:0;right:0;border-top:calc(2px * var(--k,1)) dashed var(--orange)}
.nbrk span{position:absolute;left:0;top:calc(-22px * var(--k,1));font-size:calc(var(--size-s) * var(--k,1));line-height:1.5;background:var(--orange-bg);color:var(--orange);padding:0 calc(var(--sp-2) * var(--k,1));border-radius:var(--radius);font-weight:700}
.phomenu{width:min(300px,calc(100vw - 32px))}

/* ───────── 반응형 (휴대폰 · 태블릿 · PC) ───────── */
img,svg,video,canvas{max-width:100%}
.wrap,.card,.main,.party,.grow,.gmain{min-width:0}
.store-link{display:inline-flex;align-items:center;min-height:32px;text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.hit .btn{white-space:normal;height:auto;min-height:var(--control-h);padding:var(--sp-2) var(--sp-3);line-height:1.35;text-align:center}
.dialog .acts{flex-wrap:wrap}
.dialog .acts .btn{white-space:normal;line-height:1.3;text-align:center;min-width:0}
.overlay{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:max(var(--sp-4),env(safe-area-inset-top)) max(var(--sp-4),env(safe-area-inset-right)) max(var(--sp-4),env(safe-area-inset-bottom)) max(var(--sp-4),env(safe-area-inset-left))}
.overlay>.dialog{margin:auto;flex:none}
.sigsheet{max-height:100vh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--sp-6) + env(safe-area-inset-bottom))}
.sigpad{height:min(280px,calc(100vh - 210px));height:min(280px,calc(100dvh - 210px));min-height:150px}
.toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.savestate.fs{display:none}
.sigwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 손가락 터치 기기: 누르는 곳을 넉넉하게, 입력 칸 글자 16px (아이폰·아이패드 확대 방지) */
@media (pointer:coarse){
  .inp,select.inp,textarea,.notes{font-size:var(--size-m)}
  .pgbtn{min-height:40px}
  .store-link{min-height:40px;min-width:44px}
  .btn.sm{min-height:var(--control-h)}
  .gfilter button,.phmenu .phcats button{min-height:var(--control-h)}
  .phbtns .btn{min-width:44px}
}
/* 매장 목록: 표가 들어가지 않는 폭에서는 카드로 */
@media (max-width:1100px){
  .tbl-scroll{overflow:visible}
  .tbl{min-width:0;display:block}
  .tbl thead{display:none}
  .tbl tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:var(--sp-3);padding:var(--sp-3)}
  .tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2) var(--sp-3);border:1px solid var(--line2);border-radius:var(--radius);padding:var(--sp-3) var(--sp-4);background:var(--white);align-content:start}
  .tbl td{display:block;height:auto;padding:0;border:0!important;min-width:0}
  .tbl td[data-label]::before{content:attr(data-label);display:block;font-size:var(--size-s);color:var(--muted);margin-bottom:var(--sp-1);font-weight:400}
  .tbl td.c-name,.tbl td.c-steps,.tbl td.c-act{grid-column:1/-1}
  .tbl td.c-open,.tbl td.c-doc{white-space:normal!important;overflow-wrap:anywhere}
  .tbl td.c-name .store-link{font-size:var(--size-l)}
  .tbl td.c-act{display:flex;flex-wrap:wrap;gap:var(--sp-2);text-align:left!important;white-space:normal!important;border-top:1px solid var(--line3)!important;padding-top:var(--sp-3)}
  .tbl td.c-act .btn{flex:1 1 auto}
}
/* 휴대폰 · 낮은 화면(휴대폰 가로): 위 막대는 따라오지 않고, 저장 버튼은 아래에 고정 */
@media (max-width:640px),(max-height:520px){
  .topbar,.print-bar{position:static}
  .wide-only{display:none!important}
  .foot-actions{justify-content:stretch;gap:var(--sp-2);margin:0;padding:var(--sp-2) var(--sp-3) calc(var(--sp-2) + env(safe-area-inset-bottom));border-width:1px 0 0}
  .foot-actions .btn{flex:1 1 auto;min-width:0}
  .foot-actions .btn.pri{flex:2 1 auto}
  .foot-actions .btn.back-in{flex:none;padding:0 var(--sp-2) 0 var(--sp-1)}
  .fa-br{display:block;flex-basis:100%;height:0}
  .savestate.fs{display:flex;flex:1 1 0;justify-content:flex-end;margin:0;font-size:var(--size-s)}
  .gpanel{top:0;height:auto;border-radius:0;box-shadow:none}
  .toast{bottom:calc(120px + env(safe-area-inset-bottom))}
}
@media (max-height:520px){
  .foot-actions .savestate.fs{flex-basis:auto}
  .foot-actions .fa-br{display:none}
  .dialog{padding:var(--sp-4) var(--sp-6) var(--sp-4)}
  .dialog .acts{margin-top:var(--sp-3)}
  .dialog .acts .btn{min-height:var(--control-h)}
}
/* 서명표: 휴대폰에서는 담당별 카드 */
@media (max-width:640px){
  .sigwrap{overflow:visible}
  .sigtbl{min-width:0;display:block}
  .sigtbl thead{display:none}
  .sigtbl tbody{display:grid;gap:var(--sp-3)}
  .sigtbl tr{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2) var(--sp-2);border:1px solid var(--line3);border-radius:var(--radius);padding:var(--sp-3)}
  .sigtbl td{display:block;padding:0!important;border:0}
  .sigtbl td:first-child{grid-column:1/-1;font-weight:600;font-size:var(--size-m)}
  .sigtbl td[data-label="소속"]{grid-column:1/-1}
  .sigtbl td[data-label]::before{content:attr(data-label);display:block;font-size:var(--size-s);color:var(--muted);margin-bottom:var(--sp-1);font-weight:400}
  .sigtbl td.sigc{grid-column:1/-1}
  .sigtbl td.sigc .sigbtn{width:100%}
  .dialog{padding:var(--sp-6) var(--sp-4) var(--sp-4)}
  .dialog .acts .btn{flex:1 1 120px}
}
@media (max-width:380px){
  .dialog .acts{flex-direction:column-reverse}
  .dialog .acts .btn,.dialog .acts .btn.main-act{flex:none;width:100%}
  .kpi .n{font-size:var(--size-xl)}
}
/* 큰 화면: 내용 폭을 조금 넓힘 */
@media (min-width:1340px){
  .wrap,.topbar-in{max-width:1360px}
  .tbl td.c-act{min-width:318px!important}
}
@media (min-width:1600px){
  .wrap,.topbar-in{max-width:1440px}
}

@media print{
  html,body{background:var(--white)}
  .no-print,.topbar,.print-bar,.toast,.gpanel,.overlay{display:none!important}
  .pages{padding:0;gap:0;display:block}
  .page-holder{width:auto!important;height:auto!important}
  .page{box-shadow:none;transform:none!important;break-after:page;page-break-after:always;margin:0}
  .page:last-child{break-after:auto;page-break-after:auto}
}

/* 상태는 색이 아니라 모양과 글자로 구분: 문제 = 채움, 정상 = 남색 테두리, 대기 = 회색 테두리 */
.chip{border:1px solid transparent}
.c-bad,.c-miss,.chip.orange{background:var(--navy);color:var(--var(--white));border-color:var(--navy)}
.c-ok,.chip.green{background:var(--var(--white));color:var(--navy);border-color:var(--navy)}
.c-wait{background:var(--var(--white));color:var(--text-sub);border-color:var(--line)}
.chip.blue{background:var(--tint);color:var(--navy);border-color:var(--line)}
.btn.warn{background:var(--var(--white));color:var(--navy);border-color:var(--navy)}
</style>
<style>
/* 어두운 화면 (결정 98): 화면만 색을 뒤집고 사진·서명·QR은 되돌림. 인쇄·저장 이미지는 그대로 흰 바탕 */
@media screen{
html[data-theme=dark]{filter:invert(1) hue-rotate(180deg) contrast(.78)}   /* 검정 대신 진한 회색 (사용자 11-11) */
html[data-theme=dark] :is(img,video,canvas,.keep-color):not(.keep-color *){filter:invert(1) hue-rotate(180deg)}
html[data-theme=dark] :is(.dialog-back,.overlay,.pinpop,.gprev.modal){background:rgba(255,255,255,.5)}
}
</style>
<script>
/* 기기에 고른 값 → 없으면 휴대폰 설정. 화면 그리기 전에 정해서 번쩍임 없음 */
(function () { var t = null; try { t = localStorage.getItem('fm_theme'); } catch (e) {} if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); })();
function themeDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
function toggleTheme() { var t = themeDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('fm_theme', t); } catch (e) {} document.querySelectorAll('.theme-btn').forEach(function (b) { b.textContent = themeLabel(); }); }
function themeLabel() { return themeDark() ? '밝게' : '어둡게'; }
</script>
